<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side-by-Side View | Industrial Automation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060A12;
            --nav-h: 50px;
            --border: rgba(56, 189, 248, 0.2);
            --cyan: #00F0FF;
            --green: #10B981;
            --muted: #64748B;
            --text: #F8FAFC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
        }

        /* ── TOP NAV ── */
        .topnav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-h);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: rgba(6, 10, 18, 0.97);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo-icon {
            width: 30px; height: 30px;
            background: rgba(0,240,255,0.1);
            border: 1px solid rgba(0,240,255,0.35);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .nav-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            padding: 5px 14px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
            transition: all 0.18s;
        }
        .mode-btn:hover { color: var(--text); border-color: var(--border); }
        .mode-btn.a-blue  { background: rgba(2,132,199,0.15); border-color: rgba(2,132,199,0.5); color: #38BDF8; }
        .mode-btn.a-green { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.5); color: var(--green); }
        .mode-btn.a-both  { background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.5); color: var(--cyan); }

        .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .util-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.18s;
        }
        .util-btn:hover { color: var(--cyan); border-color: rgba(0,240,255,0.4); background: rgba(0,240,255,0.07); }

        .back-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            text-decoration: none;
            transition: all 0.18s;
        }
        .back-link:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

        /* ── FRAME LABELS ── */
        .frame-labels {
            position: fixed;
            top: var(--nav-h);
            left: 0; right: 0;
            height: 30px;
            z-index: 90;
            display: flex;
            background: rgba(6, 10, 18, 0.95);
            border-bottom: 1px solid var(--border);
        }

        .f-label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .f-label-w1 { color: #38BDF8; border-right: 1px solid var(--border); }
        .f-label-w2 { color: var(--green); }

        .f-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-b { background: #38BDF8; box-shadow: 0 0 5px #38BDF8; }
        .dot-g { background: var(--green); box-shadow: 0 0 5px var(--green); }

        .f-open {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid currentColor;
            color: inherit;
            text-decoration: none;
            opacity: 0.55;
            transition: opacity 0.18s;
        }
        .f-open:hover { opacity: 1; }

        /* ── SPLIT AREA ── */
        .split-wrap {
            position: fixed;
            top: calc(var(--nav-h) + 30px);
            bottom: 0; left: 0; right: 0;
            display: flex;
        }

        .frame-pane {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .frame-pane iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Loading overlay */
        .f-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: var(--bg);
            z-index: 5;
            transition: opacity 0.4s;
        }
        .f-loading.gone { opacity: 0; pointer-events: none; }
        .spinner {
            width: 36px; height: 36px;
            border: 2px solid rgba(0,240,255,0.12);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        .spinner-g { border: 2px solid rgba(16,185,129,0.12); border-top-color: var(--green); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .f-load-lbl {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Draggable divider */
        .divider {
            width: 4px;
            background: linear-gradient(to bottom, transparent, rgba(0,240,255,0.4) 20%, rgba(0,240,255,0.7) 50%, rgba(0,240,255,0.4) 80%, transparent);
            cursor: col-resize;
            flex-shrink: 0;
            z-index: 10;
            position: relative;
            transition: width 0.15s;
        }
        .divider:hover, .divider.dragging { width: 5px; }
        .divider-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }
        .dh-dot { width: 4px; height: 4px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 4px var(--cyan); }

        /* Drag overlay to prevent iframe stealing mouse */
        .drag-shield {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            cursor: col-resize;
        }
        .drag-shield.on { display: block; }

        /* Single-pane modes */
        .split-wrap.mode-w1 .pane-w2, .split-wrap.mode-w1 .divider { display: none; }
        .split-wrap.mode-w2 .pane-w1, .split-wrap.mode-w2 .divider { display: none; }
    </style>
</head>
<body>

    <!-- TOP NAV -->
    <nav class="topnav">
        <div class="nav-left">
            <div class="nav-logo-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00F0FF" stroke-width="2">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                    <polyline points="2 17 12 22 22 17"/>
                    <polyline points="2 12 12 17 22 12"/>
                </svg>
            </div>
            <div class="nav-title">Side-by-Side View</div>
        </div>

        <div class="nav-center">
            <button class="mode-btn" id="btnW1" onclick="setMode('w1')">Week 1 Only</button>
            <span class="sep"></span>
            <button class="mode-btn a-both" id="btnBoth" onclick="setMode('both')">&#9707; Both</button>
            <span class="sep"></span>
            <button class="mode-btn" id="btnW2" onclick="setMode('w2')">Week 2 Only</button>
        </div>

        <div class="nav-right">
            <button class="util-btn" onclick="swapPanes()">&#8644; Swap</button>
            <button class="util-btn" onclick="resetSplit()">50/50</button>
            <a class="back-link" href="/">&#8592; Portal</a>
        </div>
    </nav>

    <!-- FRAME LABELS -->
    <div class="frame-labels" id="frameLabels">
        <div class="f-label f-label-w1" id="lbl1">
            <span class="f-dot dot-b"></span>
            WEEK 1 — Robotics Path Planner PRO
            <a class="f-open" href="/week1/" target="_blank">&#8599;</a>
        </div>
        <div class="f-label f-label-w2" id="lbl2">
            <span class="f-dot dot-g"></span>
            WEEK 2 — Quality Inspection System
            <a class="f-open" href="/week2/" target="_blank">&#8599;</a>
        </div>
    </div>

    <!-- SPLIT AREA -->
    <div class="split-wrap" id="splitWrap">
        <div class="frame-pane pane-w1" id="pane1">
            <div class="f-loading" id="load1">
                <div class="spinner"></div>
                <div class="f-load-lbl">Loading Week 1&hellip;</div>
            </div>
            <iframe src="/week1/" title="Week 1" onload="loaded('load1')"></iframe>
        </div>

        <div class="divider" id="divider">
            <div class="divider-handle">
                <div class="dh-dot"></div>
                <div class="dh-dot"></div>
                <div class="dh-dot"></div>
                <div class="dh-dot"></div>
                <div class="dh-dot"></div>
            </div>
        </div>

        <div class="frame-pane pane-w2" id="pane2">
            <div class="f-loading" id="load2">
                <div class="spinner spinner-g"></div>
                <div class="f-load-lbl">Loading Week 2&hellip;</div>
            </div>
            <iframe src="/week2/" title="Week 2" onload="loaded('load2')"></iframe>
        </div>
    </div>

    <div class="drag-shield" id="shield"></div>

    <script>
        const wrap   = document.getElementById('splitWrap');
        const div    = document.getElementById('divider');
        const p1     = document.getElementById('pane1');
        const p2     = document.getElementById('pane2');
        const shield = document.getElementById('shield');
        let pct = 50, dragging = false, swapped = false;

        function loaded(id) {
            document.getElementById(id).classList.add('gone');
        }

        function applyWidths() {
            const a = swapped ? (100 - pct) : pct;
            const b = 100 - a;
            p1.style.width = `calc(${a}% - 2px)`;
            p2.style.width = `calc(${b}% - 2px)`;
            p1.style.flex = 'none';
            p2.style.flex = 'none';
        }

        function resetSplit() { pct = 50; applyWidths(); }

        function setMode(m) {
            wrap.className = 'split-wrap';
            document.getElementById('lbl1').style.display = 'flex';
            document.getElementById('lbl2').style.display = 'flex';
            ['btnW1','btnBoth','btnW2'].forEach(id =>
                document.getElementById(id).className = 'mode-btn');
            if (m === 'w1') {
                wrap.classList.add('mode-w1');
                document.getElementById('btnW1').classList.add('a-blue');
                document.getElementById('lbl2').style.display = 'none';
            } else if (m === 'w2') {
                wrap.classList.add('mode-w2');
                document.getElementById('btnW2').classList.add('a-green');
                document.getElementById('lbl1').style.display = 'none';
            } else {
                document.getElementById('btnBoth').classList.add('a-both');
                applyWidths();
            }
        }

        function swapPanes() {
            swapped = !swapped;
            if (swapped) {
                wrap.insertBefore(div, p1);
                wrap.insertBefore(p2, div);
            } else {
                wrap.insertBefore(p1, div);
                wrap.insertBefore(div, p2);
            }
            applyWidths();
        }

        // Drag logic
        div.addEventListener('mousedown', e => {
            e.preventDefault();
            dragging = true;
            div.classList.add('dragging');
            shield.classList.add('on');
        });

        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            const r = wrap.getBoundingClientRect();
            let p = ((e.clientX - r.left) / r.width) * 100;
            p = Math.max(20, Math.min(80, p));
            pct = swapped ? (100 - p) : p;
            applyWidths();
        });

        document.addEventListener('mouseup', () => {
            if (!dragging) return;
            dragging = false;
            div.classList.remove('dragging');
            shield.classList.remove('on');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === '1') setMode('w1');
            else if (e.key === '2') setMode('w2');
            else if (e.key === '3' || e.key === 's') setMode('both');
            else if (e.key === 'r') resetSplit();
        });

        // Init
        applyWidths();
    </script>
</body>
</html>
