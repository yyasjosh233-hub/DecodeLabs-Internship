<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGM Student Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .status-indicator {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.9em;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .status-indicator.firebase {
            background: rgba(76, 175, 80, 0.3);
            border-color: rgba(76, 175, 80, 0.5);
        }
        
        .status-indicator.local {
            background: rgba(255, 193, 7, 0.3);
            border-color: rgba(255, 193, 7, 0.5);
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        .status-dot.online {
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        .status-dot.offline {
            background: #FFC107;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .content {
            padding: 40px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        
        .tab-button {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-button:hover {
            color: #667eea;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="search"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        input[type="search"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #bee5eb;
        }
        
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .results-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        .results-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        .results-table tr:hover {
            background: #f8f9ff;
        }
        
        .results-table tr:nth-child(even) {
            background: #f9f9f9;
        }
        
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-bar input {
            flex: 1;
        }
        
        .search-bar button {
            padding: 12px 30px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 RGM Student Management System</h1>
            <p>Add, search, and manage student records efficiently</p>
            <div id="status-badge" class="status-indicator"></div>
        </div>
        
        <div class="content">
            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('add')">➕ Add Student</button>
                <button class="tab-button" onclick="switchTab('search')">🔍 Search Student</button>
                <button class="tab-button" onclick="switchTab('view')">📋 View All</button>
                <button class="tab-button" onclick="switchTab('delete')">🗑️ Delete Student</button>
            </div>
            
            <!-- Add Student Tab -->
            <div id="add" class="tab-content active">
                <h2>Add a New Student</h2>
                <div id="add-message"></div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="student-id">Student ID *</label>
                        <input type="text" id="student-id" placeholder="e.g., STU001" required>
                    </div>
                    <div class="form-group">
                        <label for="student-name">Full Name *</label>
                        <input type="text" id="student-name" placeholder="e.g., John Doe" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="student-email">Email Address *</label>
                        <input type="email" id="student-email" placeholder="e.g., john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="student-phone">Phone Number</label>
                        <input type="text" id="student-phone" placeholder="e.g., +1-555-1234">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="student-grade">Grade/Class</label>
                        <input type="text" id="student-grade" placeholder="e.g., 10-A">
                    </div>
                    <div class="form-group">
                        <label for="student-enrollment">Enrollment Date</label>
                        <input type="date" id="student-enrollment">
                    </div>
                </div>
                
                <button class="btn-primary" onclick="addStudent()">➕ Add Student</button>
            </div>
            
            <!-- Search Student Tab -->
            <div id="search" class="tab-content">
                <h2>Search for Students</h2>
                <div id="search-message"></div>
                
                <div class="search-bar">
                    <input type="search" id="search-query" placeholder="Search by ID, name, or email..." onkeypress="if(event.key === 'Enter') searchStudent()">
                    <button class="btn-primary" onclick="searchStudent()">🔍 Search</button>
                </div>
                
                <div id="search-results"></div>
            </div>
            
            <!-- View All Tab -->
            <div id="view" class="tab-content">
                <h2>All Students in Database</h2>
                <div id="view-message"></div>
                
                <button class="btn-primary" onclick="viewAllStudents()">📋 Load All Students</button>
                <div id="view-results"></div>
            </div>
            
            <!-- Delete Student Tab -->
            <div id="delete" class="tab-content">
                <h2>Remove a Student</h2>
                <div id="delete-message"></div>
                
                <div class="form-group">
                    <label for="delete-id">Student ID *</label>
                    <input type="text" id="delete-id" placeholder="e.g., STU001" required>
                </div>
                
                <button class="btn-danger" onclick="deleteStudent()">🗑️ Delete Student</button>
            </div>
        </div>
    </div>
    
    <script>
        // Load status on page load
        window.addEventListener('load', function() {
            loadStatus();
        });
        
        function loadStatus() {
            fetch('/api/status')
            .then(response => response.json())
            .then(data => {
                const badge = document.getElementById('status-badge');
                const isFirebase = data.database === 'Firebase (Cloud)';
                
                badge.className = `status-indicator ${isFirebase ? 'firebase' : 'local'}`;
                badge.innerHTML = `
                    <span class="status-dot ${isFirebase ? 'online' : 'offline'}"></span>
                    <strong>${data.database}</strong> - ${data.status}
                `;
                
                // Show tooltip on hover
                badge.title = data.message;
            })
            .catch(err => {
                console.log('Status check failed:', err);
            });
        }
        
        function switchTab(tabName) {
            // Hide all tabs
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            
            // Add active class to clicked button
            event.target.classList.add('active');
        }
        
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="message ${type}">${message}</div>`;
        }
        
        function showTable(elementId, results, title) {
            if (results.length === 0) {
                document.getElementById(elementId).innerHTML = '<div class="empty-state"><h3>No Results</h3><p>No students found</p></div>';
                return;
            }
            
            let html = `<table class="results-table"><thead><tr>`;
            
            // Add headers
            const headers = ['Student ID', 'Name', 'Email', 'Phone', 'Grade', 'Enrollment Date'];
            headers.forEach(header => {
                html += `<th>${header}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            // Add rows
            results.forEach(student => {
                html += `<tr>
                    <td>${student.student_id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.phone}</td>
                    <td>${student.grade}</td>
                    <td>${student.enrollment_date}</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            document.getElementById(elementId).innerHTML = html;
        }
        
        function addStudent() {
            const studentId = document.getElementById('student-id').value;
            const name = document.getElementById('student-name').value;
            const email = document.getElementById('student-email').value;
            const phone = document.getElementById('student-phone').value;
            const grade = document.getElementById('student-grade').value;
            const enrollmentDate = document.getElementById('student-enrollment').value;
            
            if (!studentId || !name || !email) {
                showMessage('add-message', '❌ Student ID, Name, and Email are required.', 'error');
                return;
            }
            
            fetch('/api/add-student', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    student_id: studentId,
                    name: name,
                    email: email,
                    phone: phone,
                    grade: grade,
                    enrollment_date: enrollmentDate
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('add-message', `✅ ${data.message}`, 'success');
                    // Clear form
                    document.getElementById('student-id').value = '';
                    document.getElementById('student-name').value = '';
                    document.getElementById('student-email').value = '';
                    document.getElementById('student-phone').value = '';
                    document.getElementById('student-grade').value = '';
                    document.getElementById('student-enrollment').value = '';
                } else {
                    showMessage('add-message', `❌ ${data.message}`, 'error');
                }
            })
            .catch(error => {
                showMessage('add-message', `❌ Error: ${error}`, 'error');
            });
        }
        
        function searchStudent() {
            const query = document.getElementById('search-query').value;
            
            if (!query) {
                showMessage('search-message', '❌ Please enter a search term.', 'error');
                return;
            }
            
            fetch(`/api/search-student?q=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('search-message', `✅ ${data.message}`, 'info');
                    showTable('search-results', data.results);
                } else {
                    showMessage('search-message', `❌ ${data.message}`, 'error');
                    document.getElementById('search-results').innerHTML = '';
                }
            })
            .catch(error => {
                showMessage('search-message', `❌ Error: ${error}`, 'error');
            });
        }
        
        function viewAllStudents() {
            fetch('/api/all-students')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('view-message', `✅ ${data.message}`, 'info');
                    showTable('view-results', data.results);
                } else {
                    showMessage('view-message', `❌ ${data.message}`, 'error');
                }
            })
            .catch(error => {
                showMessage('view-message', `❌ Error: ${error}`, 'error');
            });
        }
        
        function deleteStudent() {
            const studentId = document.getElementById('delete-id').value;
            
            if (!studentId) {
                showMessage('delete-message', '❌ Please enter a Student ID.', 'error');
                return;
            }
            
            if (!confirm(`Are you sure you want to delete student ${studentId}? This action cannot be undone.`)) {
                return;
            }
            
            fetch('/api/delete-student', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    student_id: studentId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('delete-message', `✅ ${data.message}`, 'success');
                    document.getElementById('delete-id').value = '';
                } else {
                    showMessage('delete-message', `❌ ${data.message}`, 'error');
                }
            })
            .catch(error => {
                showMessage('delete-message', `❌ Error: ${error}`, 'error');
            });
        }
    </script>
</body>
</html>
